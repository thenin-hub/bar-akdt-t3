<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px "Avenir Next", "Avenir Next LT Pro", Avenir, "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Comptoir"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#052F5B"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"></head><body>
<title>Comptoir Jetons</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen till for iPad. Top bar (brand, tabs filtered by permission, status, user).
   Caisse = product grid + ticket column; stacks below 900px. Other tabs are scrolling pages.
   Dark-first (bar lighting); light variant included. Accent = brass, like the tokens themselves. */
:root{
  --ground:#0D1A1D; --surface:#14262A; --surface-2:#1C3237; --line:#2B4549;
  --fg:#E7EFEE; --muted:#8EA8AC;
  --accent:#D8B04A; --on-accent:#1A1304; --accent-text:#E8C56A;
  --coin-hi:#F4DE9F; --coin-lo:#A5802A;
  --ok:#52C28C; --warn:#F09258; --crit:#F27272;
  --display:"Avenir Next", "Avenir Next LT Pro", Avenir, "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --body:"Avenir Next", "Avenir Next LT Pro", Avenir, "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"Avenir Next", "Avenir Next LT Pro", Avenir, "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --ground:#E9F0EF; --surface:#F9FCFB; --surface-2:#DDE8E7; --line:#C2D3D2;
    --fg:#0E2124; --muted:#4D686C;
    --accent:#C9971F; --on-accent:#1A1304; --accent-text:#80590A;
    --coin-hi:#F2D27E; --coin-lo:#8D6A12;
    --ok:#1E8A5A; --warn:#B5560F; --crit:#C0392F;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --ground:#E9F0EF; --surface:#F9FCFB; --surface-2:#DDE8E7; --line:#C2D3D2;
  --fg:#0E2124; --muted:#4D686C;
  --accent:#C9971F; --on-accent:#1A1304; --accent-text:#80590A;
  --coin-hi:#F2D27E; --coin-lo:#8D6A12;
  --ok:#1E8A5A; --warn:#B5560F; --crit:#C0392F;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--fg);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;font-family:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.01em;text-wrap:balance}
h1{font-size:34px;line-height:1.05}
h2{font-size:26px;line-height:1.1}
h3{font-size:20px}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app.solo{grid-template-rows:minmax(0,1fr)}

/* coin */
.coin{display:inline-block;width:.78em;height:.78em;border-radius:50%;background:var(--accent);background:radial-gradient(circle at 35% 30%,var(--coin-hi),var(--accent) 55%,var(--coin-lo));box-shadow:inset 0 0 0 .11em var(--coin-lo);vertical-align:-.06em;margin-left:.28em;flex:none}
.coin.lg{width:30px;height:30px;margin:0}
.tok{display:inline-flex;align-items:baseline;white-space:nowrap}
.tok b{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.tok.neg b{color:var(--warn)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{border-color:var(--crit);color:var(--crit);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn.xl{min-height:64px;font-size:19px;width:100%}
.btn.sq{width:48px;padding:0;font-size:22px;line-height:1}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase}
.brand.big{font-size:40px;justify-content:center}
.brand.big .coin.lg{width:38px;height:38px}
.tabs{display:flex;gap:6px;flex:1 1 320px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:transparent;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{background:var(--surface);border-color:var(--line);color:var(--fg);box-shadow:inset 0 -3px 0 var(--accent)}
.right{display:flex;align-items:center;gap:10px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.crit{color:var(--crit)} .chip.mute{color:var(--muted)}
.who{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--display);font-weight:800;font-size:20px;color:var(--accent-text)}
.who .nm{font-weight:600;line-height:1.1}
.who .rl{font-size:12px;color:var(--muted)}

.main{min-height:0;overflow:auto;padding-block:6px 20px}
.main.fill{overflow:hidden;padding-bottom:12px}
.page{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.panel>h3{margin-bottom:12px}
.empty{color:var(--muted);padding:18px 4px}

/* login */
.center{height:100%;display:grid;place-items:center;overflow:auto;padding-block:16px}
.card{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:20px}
.card h1{text-align:center}
.staffgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.staffbtn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;min-height:120px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:600}
.staffbtn .avatar{width:52px;height:52px;font-size:28px;background:var(--ground)}
.staffbtn small{color:var(--muted);font-weight:500}
.dots{display:flex;justify-content:center;gap:14px;min-height:20px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;width:100%;margin:0 auto}
.pad button{min-height:72px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--mono);font-size:26px;font-weight:500}
.pad button.alt{font-family:var(--body);font-size:15px;color:var(--muted);background:transparent}
.err{color:var(--crit);text-align:center;font-weight:600;min-height:1.4em}
.banner{padding:10px 14px;border-radius:10px;border:1px solid var(--warn);color:var(--warn);font-size:14px}

/* caisse */
.pos{height:100%;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px}
.catalog{min-height:0;min-width:0;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-flow:row nowrap;gap:8px;min-width:0;max-width:100%;overflow-x:auto;overflow-y:hidden;padding-inline:0 16px;scroll-padding-inline:16px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;flex:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{height:4px}
.chips::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
.chips::-webkit-scrollbar-track{background:transparent}
.groupbar{display:flex;flex-flow:row nowrap;gap:10px;min-width:0;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:2px 0 6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;flex:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain}.groupbtn{flex:0 0 auto;min-height:54px;padding:0 24px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-weight:800;font-size:19px;letter-spacing:.02em;white-space:nowrap}.groupbtn[aria-pressed="true"]{box-shadow:inset 0 -4px 0 var(--accent);filter:brightness(1.12)}.group-grip{display:inline-block;margin-right:8px;touch-action:none;cursor:grab;opacity:.8}.cat{flex:0 0 auto;white-space:nowrap;scroll-snap-align:center;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.cat[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:clamp(96px,10vw,112px);gap:clamp(3px,.65vw,8px);align-content:start;padding:0 0 4px}
/* Six colonnes fixes sur tous les écrans: cartes compactes mais proportions cohérentes. */
.tile{padding:clamp(5px,.8vw,10px);border-radius:clamp(8px,1vw,12px);gap:3px;overflow:hidden;}
.tile.arr{padding-top:clamp(32px,3.5vw,38px)}
.tname{display:-webkit-box;width:100%;max-height:3.3em;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow-wrap:anywhere;word-break:break-word;padding:0;font-size:clamp(9px,1.25vw,15px);line-height:1.1}
.tval{font-size:clamp(10px,1.45vw,16px);line-height:1.05}
.token-price{min-width:0;max-width:100%;gap:1px}
.token-price .tok{font-size:inherit}
.token-price small{font-size:clamp(7px,.92vw,11px);line-height:1;white-space:nowrap}
.total-euro{font-size:clamp(7px,.92vw,11px)}

.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-width:0}
.tile:active{background:var(--surface-2)}
.tile.neg{border-style:dashed;border-color:var(--warn)}
.tile.colored .total-euro,.tile.colored .token-price small{color:inherit;opacity:.84}
.cat[data-drag-kind="category"]{cursor:grab}
.cat-grip{display:inline-grid;place-items:center;width:24px;height:28px;margin-left:-5px;touch-action:none;cursor:grab;color:inherit;opacity:.8;vertical-align:middle;-webkit-user-select:none;user-select:none}
.cat.dragging{opacity:.72;z-index:35;position:relative}
.palette{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.swatch{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;border:2px solid rgba(127,145,145,.55);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.swatch:focus-visible{outline-offset:2px}
.color-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.color-tools input[type=color]{width:42px;height:38px;min-height:38px;padding:3px;border-radius:9px}
.row.color-row{gap:14px}.category-edit{flex:1 1 190px;min-width:170px}.category-color input{width:48px;height:48px;min-height:48px;padding:3px;border-radius:10px;border:1px solid var(--line);background:var(--ground)}.category-confirm{flex-basis:100%;padding-top:8px}.category-confirm select{min-height:48px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--ground);font-size:16px}.category-add{grid-template-columns:minmax(170px,2fr) minmax(150px,1fr) 90px auto;align-items:end}
.drop-before.cat{box-shadow:-4px 0 0 var(--accent)} .drop-after.cat{box-shadow:4px 0 0 var(--accent)}.groupbtn[data-drag-kind="group"]{cursor:grab}.groupbtn.dragging{opacity:.7}.drop-before.groupbtn{box-shadow:-4px 0 0 var(--accent)} .drop-after.groupbtn{box-shadow:4px 0 0 var(--accent)}
.tname{font-weight:600;font-size:18px;line-height:1.15;overflow-wrap:anywhere;padding-right:30px}
.tval{font-size:20px}
.token-price{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px}.token-price small{font:500 12px/1.1 var(--body);color:var(--muted)}.total-euro{display:block;font-size:14px;color:var(--muted);font-weight:500}
.qty{position:absolute;top:8px;right:8px;min-width:28px;height:28px;padding:0 7px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:15px}
.ticket{min-height:0;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.thead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tlines{flex:1;min-height:60px;overflow:auto;display:flex;flex-direction:column}
.tline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.tline .n{font-weight:600;overflow-wrap:anywhere}
.step{display:flex;align-items:center;gap:4px}
.step .btn{min-height:44px;width:44px;padding:0;font-size:22px}
.step .q{min-width:28px;text-align:center;font-family:var(--mono);font-weight:600}
.tline .sub{font-size:16px;min-width:54px;text-align:right}
.tline .sub .token-price{align-items:flex-end}.tline .sub .token-price small{font-size:11px}
.ttotal{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:2px solid var(--line);padding-top:10px}
.ttotal .lbl{color:var(--muted);font-weight:600}
.ttotal .big{font-family:var(--display);font-weight:800;font-size:60px;line-height:.9;display:inline-flex;align-items:baseline;font-variant-numeric:tabular-nums}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--display);font-weight:800;font-size:48px;line-height:1.05;display:flex;align-items:baseline;font-variant-numeric:tabular-nums}
.stat .v.sm{font-size:40px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{font-family:var(--mono)}
td.nm{position:relative;min-width:150px}
td.nm .bar{position:absolute;left:0;top:6px;bottom:6px;background:var(--accent);opacity:.16;border-radius:6px}
td.nm .t{position:relative}
.sale{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sale .tm{font-family:var(--mono);color:var(--muted);min-width:52px}
.sale .body{flex:1 1 220px;min-width:0}
.sale .body .by{font-size:13px;color:var(--muted)}
.sale.void .body .items{text-decoration:line-through;color:var(--muted)}
.sale .acts{display:flex;gap:8px;align-items:center}

/* forms & rows */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.fld label{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;min-height:48px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--ground);font-size:16px}
.fld textarea{padding:10px 12px;min-height:84px;resize:vertical}
.rows .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.row .main-info{flex:1 1 200px;min-width:0}
.row .main-info .t{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.row .main-info .s{font-size:13px;color:var(--muted)}
.row .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.edit{display:block}
.row.off .main-info .t{color:var(--muted)}
.swcell{display:flex;align-items:center;gap:8px;min-height:48px;font-size:14px;color:var(--muted)}
.sw{width:54px;height:32px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:var(--on-accent)}
.sw:disabled{opacity:.6}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm span{color:var(--crit);font-weight:600}
.perm-tbl td.c,.perm-tbl th.c{text-align:center}
.perm-tbl .pd{font-size:13px;color:var(--muted)}

/* glisser-déposer */
.handle{touch-action:none;cursor:grab;font-size:26px;line-height:1;color:var(--muted);flex:none;width:44px;height:44px;display:grid;place-items:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile.arr{border-style:dashed;border-color:var(--accent)}
.drag-grip{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:rgba(8,18,20,.34);font-size:20px;line-height:1;touch-action:none;cursor:grab;color:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;z-index:1;flex:none}
[data-drag].dragging{pointer-events:none;opacity:.88;z-index:30;position:relative;box-shadow:0 10px 28px rgba(0,0,0,.45);background:var(--surface-2)}
.tile.drop-before{box-shadow:-5px 0 0 var(--accent)} .tile.drop-after{box-shadow:5px 0 0 var(--accent)}
.row.drop-before{box-shadow:0 -3px 0 var(--accent)} .row.drop-after{box-shadow:0 3px 0 var(--accent)}
/* cloture */
.gap{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.gap.ok{color:var(--ok)} .gap.warn{color:var(--warn)}
.hist{border-bottom:1px solid var(--line)}
.hist-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%;min-height:64px;padding:10px 0;background:transparent;border:0;text-align:left}
.hist-head .d{flex:1 1 180px;font-weight:600}
.hist-head .d small{display:block;color:var(--muted);font-weight:500}
.hist-body{padding:4px 0 18px;display:flex;flex-direction:column;gap:14px}
pre.report{margin:0;padding:14px;border-radius:10px;background:var(--ground);border:1px solid var(--line);font:13px/1.5 var(--mono);overflow-x:auto;white-space:pre}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(560px,calc(100vw - 32px));padding:14px 20px;border-radius:12px;background:var(--fg);color:var(--ground);font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:20;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--crit);color:#fff}

@media (max-width:900px){
  .pos{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}

/* ----- Caisse ----- */
function caisse(){
  var act=S.products.filter(function(p){return p.active!==false;});
  var groups=groupOrder();if(groups.indexOf(S.group)<0)S.group=groups[0]||'boissons';
  var groupCats=Array.from(new Set(act.map(function(p){return p.category||'Divers';}))).filter(function(c){return categoryGroupId(c)===S.group;});
  var catList=orderedCategories(groupCats),cats=['Tous'].concat(catList);
  if(cats.indexOf(S.cat)<0)S.cat='Tous';
  var shown=act.filter(function(p){return categoryGroupId(p.category||'Divers')===S.group&&(S.cat==='Tous'||(p.category||'Divers')===S.cat);}).sort(byOrder);
  var arr=!!S.ui.arrange&&can('products');
  var tiles;
  if(!shown.length){
    tiles='<div class="panel" style="grid-column:1/-1"><h3>Aucun produit au menu</h3><p class="muted" style="margin-bottom:14px">'+(can('products')?'Aucun produit dans ce groupe ou cette catégorie. Ajoutez ou déplacez une catégorie depuis Produits.':'Demandez au patron d’ajouter des produits.')+'</p>'+
      (can('products')?'<div class="confirm"><button class="btn primary" data-act="prodSamples">Ajouter 8 produits d’exemple</button><button class="btn" data-act="nav" data-v="produits">Créer mes produits</button></div>':'')+'</div>';
  }else{
    tiles=shown.map(function(p){
      var q=S.ticket[p.id],categoryColor=(catalogSettings().categoryColors||{})[p.category||'Divers'];
      var tileColor=validColor(p.color)||validColor(categoryColor);
      if(arr)return '<div class="tile arr'+(tileColor?' colored':'')+'"'+colorStyle(tileColor)+' data-drag="'+esc(p.id)+'" data-drag-kind="product"><span class="drag-grip" data-handle aria-label="Déplacer le produit">⠿</span><span class="tname">'+esc(p.name)+'</span><span class="tval">'+tok(p.tokens)+'</span></div>';
      return '<button class="tile'+(p.tokens<0?' neg':'')+(tileColor?' colored':'')+'"'+colorStyle(tileColor)+' data-act="add" data-id="'+esc(p.id)+'">'+(q?'<span class="qty">'+q+'</span>':'')+
        '<span class="tname">'+esc(p.name)+'</span><span class="tval">'+tokenPrice(p.tokens)+'</span></button>';
    }).join('');
  }
  var items=ticketItems(),total=items.reduce(function(a,i){return a+i.qty*i.tokens;},0),n=items.reduce(function(a,i){return a+i.qty;},0);
  var totalEuro=eurFromTokens(total);
  var lines=items.length?items.map(function(i){
    return '<div class="tline"><span class="n">'+esc(i.name)+'</span>'+
      '<span class="step"><button class="btn" data-act="dec" data-id="'+esc(i.pid)+'" aria-label="Retirer un '+esc(i.name)+'">−</button><span class="q">'+i.qty+'</span><button class="btn" data-act="add" data-id="'+esc(i.pid)+'" aria-label="Ajouter un '+esc(i.name)+'">+</button></span>'+
      '<span class="sub">'+tokenPrice(i.qty*i.tokens)+'</span></div>';
  }).join(''):'<p class="empty">Touchez un produit pour l’ajouter au ticket.</p>';
  return '<section class="pos">'+
    '<div class="catalog"><div class="groupbar" data-scroll="groups" role="group" aria-label="Groupes">'+groups.map(function(g){var gc=(catalogSettings().groupColors||{})[g];return '<button class="groupbtn"'+(arr?' data-drag="'+esc(g)+'" data-drag-kind="group"':'')+colorStyle(gc)+' data-act="group" data-g="'+esc(g)+'" aria-pressed="'+(g===S.group)+'">'+(arr?'<span class="group-grip" data-handle aria-label="Réordonner le groupe">⠿</span>':'')+esc(groupName(g))+'</button>';}).join('')+'</div><div class="chips" data-scroll="chips" role="group" aria-label="Catégories">'+cats.map(function(c){
      var cc=c==='Tous'?null:(catalogSettings().categoryColors||{})[c];return '<button class="cat"'+(arr&&c!=='Tous'?' data-drag="'+esc(c)+'" data-drag-kind="category"':'')+colorStyle(cc)+' data-act="cat" data-c="'+esc(c)+'" aria-pressed="'+(c===S.cat)+'">'+(arr&&c!=='Tous'?'<span class="cat-grip" data-handle aria-label="Déplacer la catégorie">⠿</span>':'')+esc(c)+'</button>';
    }).join('')+(can('products')&&act.length?'<button class="cat" data-act="arrange" aria-pressed="'+arr+'">'+(arr?'Terminé':'✥ Personnaliser')+'</button>':'')+'</div><div class="grid" data-scroll="grid">'+tiles+'</div></div>'+
    '<aside class="ticket" aria-label="Ticket en cours"><div class="thead"><h2>Ticket</h2>'+(items.length?'<button class="btn ghost sm" data-act="clearTicket">Vider</button>':'')+'</div>'+
    '<div class="tlines" data-scroll="tlines">'+lines+'</div>'+
    '<div class="ttotal"><span class="lbl">'+n+' article'+(n>1?'s':'')+'<small class="total-euro">'+totalEuro+'</small></span><span class="big">'+nf(total)+coin()+'</span></div>'+
    '<button class="btn primary xl" data-act="validate"'+(items.length?'':' disabled')+'>Valider · '+nf(total)+' jetons</button>'+(S.ui.lastSale?'<button class="btn xl" data-act="printSale" data-id="'+esc(S.ui.lastSale.id)+'">Imprimer le ticket · dernière commande</button>':'')+'</aside>'+
  '</section>';

/* ----- Journée ----- */
function tableProducts(A,money){
  if(!A.byProduct.length)return '<p class="empty">Aucune vente pour le moment.</p>';
  var m=money&&A.byProduct.some(function(r){return r.amount!=null;});
  var max=Math.max.apply(null,A.byProduct.map(function(r){return Math.abs(r.tokens);}).concat([1]));
  return '<div class="tbl"><table><thead><tr><th>Produit</th><th class="num">Qté</th><th class="num">Jetons</th>'+(m?'<th class="num">€</th>':'')+'</tr></thead><tbody>'+
    A.byProduct.map(function(r){
      return '<tr><td class="nm"><span class="bar" style="width:'+Math.round(Math.abs(r.tokens)/max*100)+'%"></span><span class="t">'+esc(r.name)+'</span></td><td class="num">'+r.qty+'</td><td class="num">'+nf(r.tokens)+'</td>'+(m?'<td class="num">'+eur(r.amount||0)+'</td>':'')+'</tr>';
    }).join('')+'</tbody></table></div>';
}
function tableStaff(A){
  if(!A.byStaff.length)return '<p class="empty">Aucune vente pour le moment.</p>';
  return '<div class="tbl"><table><thead><tr><th>Employé</th><th class="num">Tickets</th><th class="num">Jetons</th></tr></thead><tbody>'+
    A.byStaff.map(function(r){return '<tr><td>'+esc(r.name)+'</td><td class="num">'+r.tickets+'</td><td class="num">'+nf(r.tokens)+'</td></tr>';}).join('')+'</tbody></table></div>';
}
function journee(){
  var P=period(),mine=!can('reports');
  var list=mine?P.sales.filter(function(s){return s.staffId===S.user.id;}):P.sales;
  var A=aggregate(list);
  var avg=A.tickets?A.tokens/A.tickets:0;
  var since=P.last?'Depuis la clôture de '+fmtDT(P.last):(P.sales.length?'Depuis la première vente, '+fmtDT(P.sales[0].ts):'Aucune vente enregistrée');
  var recent=list.slice().sort(function(a,b){return b.ts-a.ts;}).slice(0,15);
  var rec=recent.length?recent.map(function(s){
    var items=(s.items||[]).map(function(i){return i.qty+'× '+esc(i.name);}).join(', ');
    var acts='';
    acts='<button class="btn sm" data-act="printSale" data-id="'+esc(s.id)+'">Imprimer</button>'+(s.voided?'<span class="chip crit">Annulé</span>':'');
    if(!s.voided&&can('void')){
      acts+='<span class="void-actions">'+(S.ui.voidId===s.id?'<span class="confirm"><span>Annuler ce ticket ?</span><button class="btn danger sm" data-act="voidYes" data-id="'+esc(s.id)+'">Oui, annuler</button><button class="btn sm" data-act="voidNo">Garder</button></span>':'<button class="btn sm" data-act="voidAsk" data-id="'+esc(s.id)+'">Annuler</button>')+'</span>';
    }
    return '<div class="sale'+(s.voided?' void':'')+'"><span class="tm">'+fmtTime(s.ts)+'</span><div class="body"><div class="items">'+items+'</div><div class="by">'+esc(s.staffName||'')+'</div></div><span>'+tok(s.tokens)+'</span><span class="acts">'+acts+'</span></div>';
  }).join(''):'<p class="empty">Aucun ticket pour le moment.</p>';
  return '<div class="page">'+
    '<div class="page-head"><div><h1>'+(mine?'Mes ventes':'Journée en cours')+'</h1><p class="muted">'+esc(since)+'</p></div></div>'+
    '<div class="stats"><div class="stat"><div class="k">Jetons encaissés</div><div class="v">'+nf(A.tokens)+coin()+'</div></div>'+
    '<div class="stat"><div class="k">Tickets</div><div class="v">'+A.tickets+'</div></div>'+
    '<div class="stat"><div class="k">Moyenne par ticket</div><div class="v sm">'+nf(Math.round(avg*10)/10)+coin()+'</div></div></div>'+
    (A.voidedTickets?'<p class="muted">'+A.voidedTickets+' ticket'+(A.voidedTickets>1?'s':'')+' annulé'+(A.voidedTickets>1?'s':'')+' ('+nf(A.voidedTokens)+' jetons), non comptés ci-dessus.</p>':'')+
    '<div class="two"><div class="panel"><h3>Par produit</h3>'+tableProducts(A)+'</div>'+
    (mine?'':'<div class="panel"><h3>Par employé</h3>'+tableStaff(A)+'</div>')+'</div>'+
    '<div class="panel"><h3>Derniers tickets</h3>'+rec+'</div>'+
  '</div>';
}

  var bal=potBalance();if(type==='sortie'&&qty>bal)return {ok:false,error:'Retrait impossible : le solde est de '+nf(bal)+' jeton(s).'};
  var id=uid(),latest=potJournal().reduce(function(n,m){return Math.max(n,Number(m.ts)||0);},0),stamp=Math.max(Date.now(),latest+1),doc={type:type,qty:qty,note:String(note||'').trim(),ts:stamp,balanceAfter:bal+(type==='entree'?qty:-qty),by:S.user?S.user.name:''};

  var remaining=S.pot.filter(function(m){return m.id!==id;}),testBalance=0,invalid=false;
  remaining.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0)||String(a.id).localeCompare(String(b.id));}).forEach(function(m){testBalance+=(m.type==='entree'?1:-1)*(Number(m.qty)||0);if(testBalance<0)invalid=true;});

      wr(store.set('products',uid(),{name:pn,tokens:pt,category:newCat,groupId:newGroups[newCat],price:(function(v){return v==null?null:Math.abs(v);})(num(dr('np-price'))),order:Date.now(),active:true,createdAt:Date.now()}));
      S.drafts['np-name']='';S.drafts['np-price']='';S.drafts['np-tokens']='';S.drafts['np-neg']='';S.ui.focus='np-name';
      toast(pn+' ajouté');schedule();break;
    }
    case 'prodSamples':
      SAMPLE.forEach(function(s,i){var sg=CATEGORY_DEFAULT_GROUP[s[2]]||S.group,gm=Object.assign({},catalogSettings().categoryGroups||{});if(!gm[s[2]])gm[s[2]]=sg;wr(store.set('products',uid(),{name:s[0],tokens:s[1],category:s[2],groupId:gm[s[2]],order:Date.now()+i,active:true,createdAt:Date.now()}));});
      toast('Produits d’exemple ajoutés');schedule();break;
    case 'prodEdit':{
      var p=S.products.filter(function(x){return x.id===id;})[0];if(!p)return;
      S.ui.editP=id;S.drafts['ep-name']=p.name;S.drafts['ep-tokens']=String(Math.abs(p.tokens));S.drafts['ep-neg']=p.tokens<0?'1':'';S.drafts['ep-cat']=p.category||'';S.drafts['ep-price']=p.price==null?'':String(p.price).replace('.',',');S.ui.focus='ep-name';schedule();break;
    }
    case 'prodCancel':S.ui.editP=null;schedule();break;
    case 'prodSave':{
      var en=dr('ep-name').trim(),et=signed('ep-tokens','ep-neg');
      if(!en||et==null){toast('Indiquez un nom et une valeur en jetons.','err');return;}
      var ec=dr('ep-cat').trim()||'Divers',eg=Object.assign({},catalogSettings().categoryGroups||{}),oldp=S.products.filter(function(x){return x.id===id;})[0];if(!eg[ec]){eg[ec]=(oldp&&oldp.groupId)||S.group;saveCatalogSettings({categoryGroups:eg});}wr(store.upd('products',id,{name:en,tokens:et,price:(function(v){return v==null?null:Math.abs(v);})(num(dr('ep-price'))),category:ec,groupId:eg[ec]}));
      S.ui.editP=null;toast('Produit modifié');schedule();break;
    }
    case 'prodToggle':{
      var pp=S.products.filter(function(x){return x.id===id;})[0];if(!pp)return;
      wr(store.upd('products',id,{active:pp.active===false}));break;
    }
    case 'prodDelAsk':S.ui.delP=id;schedule();break;
    case 'prodDelNo':S.ui.delP=null;schedule();break;
    case 'prodDelYes':delete S.ticket[id];S.ui.delP=null;wr(store.del('products',id));toast('Produit supprimé');schedule();break;

    case 'staffAdd':{
      var sn=dr('ns-name').trim(),sp=dr('ns-pin').trim();
      if(!sn){toast('Indiquez un prénom.','err');return;}
      if(!/^\d{4}$/.test(sp)){toast('Le code PIN doit avoir 4 chiffres.','err');return;}
      wr(store.set('staff',uid(),{name:sn,role:dr('ns-role','serveur')||'serveur',pin:sp,active:true,createdAt:Date.now()}));
      S.drafts['ns-name']='';S.drafts['ns-pin']='';S.ui.focus='ns-name';
      toast(sn+' ajouté(e)');schedule();break;
    }
    case 'staffToggle':{
      var st=S.staff.filter(function(x){return x.id===id;})[0];if(!st)return;
      if(st.active!==false&&(lastPatron(id)||(S.user&&S.user.id===id))){toast('Impossible de désactiver ce compte.','err');return;}
      wr(store.upd('staff',id,{active:st.active===false}));break;
    }
    case 'staffRole':{
      var sr=S.staff.filter(function(x){return x.id===id;})[0];if(!sr)return;
      if(lastPatron(id)&&ds.value!=='patron'){toast('Il faut garder au moins un patron.','err');schedule();return;}
      wr(store.upd('staff',id,{role:ds.value}));break;
    }
    case 'staffEdit':{
      var se=S.staff.filter(function(x){return x.id===id;})[0];if(!se)return;
      S.ui.editS=id;S.drafts['es-name']=se.name;S.drafts['es-pin']='';S.ui.focus='es-name';schedule();break;
    }
    case 'staffCancel':S.ui.editS=null;schedule();break;
    case 'staffSave':{
      var nn=dr('es-name').trim(),np=dr('es-pin').trim();
      if(!nn){toast('Indiquez un prénom.','err');return;}
      if(np&&!/^\d{4}$/.test(np)){toast('Le code PIN doit avoir 4 chiffres.','err');return;}
      var up={name:nn};if(np)up.pin=np;
      wr(store.upd('staff',id,up));S.ui.editS=null;toast('Employé modifié');schedule();break;
    }
    case 'staffDelAsk':S.ui.delS=id;schedule();break;
    case 'staffDelNo':S.ui.delS=null;schedule();break;
    case 'staffDelYes':
      if(lastPatron(id)){toast('Il faut garder au moins un patron.','err');S.ui.delS=null;schedule();return;}
      S.ui.delS=null;wr(store.del('staff',id));toast('Employé supprimé');schedule();break;

    case 'permToggle':{
      var r=clone(roles()),perms=r[ds.role].perms,ix=perms.indexOf(ds.perm);
      if(ix>-1)perms.splice(ix,1);else perms.push(ds.perm);
      saveRoles(r);break;
    }
    case 'roleAdd':{
      var rn=dr('nr-name').trim();
      if(!rn){toast('Donnez un nom au rôle.','err');return;}
      var rr=clone(roles()),rid='r'+uid();
      rr[rid]={label:rn,perms:['sell']};
      saveRoles(rr);S.drafts['nr-name']='';toast('Rôle créé');schedule();break;
    }
    case 'roleDel':{
      if(S.staff.some(function(s){return s.role===ds.role;})){toast('Ce rôle est encore utilisé.','err');return;}
      var rd=clone(roles());delete rd[ds.role];saveRoles(rd);break;
    }

    case 'closeAsk':S.ui.closeAsk=true;schedule();break;
    case 'closeNo':S.ui.closeAsk=false;schedule();break;
    case 'closeYes':{
      var P=period();if(!P.sales.length){S.ui.closeAsk=false;schedule();return;}
      var A=aggregate(P.sales),cv=num(dr('cl-count')),cid=uid();
      var c={closedAt:Date.now(),closedBy:S.user.id,closedByName:S.user.name,
        from:Math.min.apply(null,P.sales.map(function(s){return s.ts;})),
        tokens:A.tokens,tickets:A.tickets,voidedTickets:A.voidedTickets,voidedTokens:A.voidedTokens,
        amount:A.amount,missing:A.missing,counted:cv,gap:cv==null?null:cv-A.tokens,note:dr('cl-note').trim(),byProduct:A.byProduct,byStaff:A.byStaff};
      S.closings=S.closings.concat([Object.assign({id:cid},c)]);
      wr(store.set('closings',cid,c),'Clôture NON enregistrée. Réessayez.');
      S.ui.closeAsk=false;S.ui.histId=cid;S.drafts['cl-count']='';S.drafts['cl-note']='';
      toast('Journée clôturée · '+nf(A.tokens)+' jetons');schedule();break;
    }
    case 'histToggle':S.ui.histId=S.ui.histId===id?null:id;S.ui.copyFallback=null;schedule();break;
    case 'copyReport':{
      var cc=S.closings.filter(function(x){return x.id===id;})[0];if(cc)copyText(reportText(cc),id);break;
    }
    case 'exportXlsx':{
      var cx=S.closings.filter(function(x){return x.id===id;})[0];if(!cx)return;
      var dx=new Date(cx.closedAt),fx='releve-'+dx.getFullYear()+'-'+('0'+(dx.getMonth()+1)).slice(-2)+'-'+('0'+dx.getDate()).slice(-2)+'.xlsx';
      try{saveBlob(reportXlsx(cx),fx).then(function(){toast('Fichier Excel prêt');},function(e){if(!e||e.name!=='AbortError')toast('Export impossible','err');});}
      catch(e){toast('Export impossible','err');}
      break;
    }
    case 'exportCsv':{
      var ce=S.closings.filter(function(x){return x.id===id;})[0];if(!ce||!dlNS)return;
      var d=new Date(ce.closedAt),fn='releve-'+d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+'.csv';
      dlNS.save({filename:fn,data:reportCsv(ce)}).then(function(){toast('Fichier enregistré');},function(e){if(!e||e.code!=='declined')toast('Export impossible','err');});
      break;
    }
  }
}

/* ---------- événements ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  act(el.getAttribute('data-act'),Object.assign({},el.dataset));
});
document.addEventListener('wheel',function(e){
  var sc=e.target.closest&&e.target.closest('.chips');
  if(!sc||Math.abs(e.deltaY)<=Math.abs(e.deltaX)||sc.scrollWidth<=sc.clientWidth)return;
  sc.scrollLeft+=e.deltaY;e.preventDefault();
},{passive:false});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))S.drafts[t.id]=t.value;
  if(t.hasAttribute&&t.hasAttribute('data-cat-name'))S.drafts['cat-name-'+t.getAttribute('data-cat-name')]=t.value;
  if(t.id&&t.id.indexOf('category-color-')===0)S.drafts[t.id]=t.value;
  if(t.id==='cl-count')schedule();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches&&t.matches('[data-color-input]')){var k=t.getAttribute('data-color-input'),i=t.getAttribute('data-id'),c=validColor(t.value);if(c&&k==='category'){S.drafts['category-color-'+i]=c;}else if(c)act('setColor',{kind:k,id:i,color:c});return;}
  if(t.id==='new-category-color'){S.drafts[t.id]=t.value;return;}
  if(t.tagName!=='SELECT')return;
  if(t.id)S.drafts[t.id]=t.value;
  if(t.id==='pr-model'){S.drafts['pr-chars']=t.value==='58mm'?'32':'48';var width=document.getElementById('pr-chars');if(width)width.value=S.drafts['pr-chars'];}
  var a=t.getAttribute('data-chg');
  if(a)act(a,Object.assign({},t.dataset,{value:t.value}));
});
['pointerdown','keydown'].forEach(function(ev){document.addEventListener(ev,function(){lastAct=Date.now();},{passive:true});});
/* ---------- glisser-déposer (tactile et souris, poignée uniquement) ---------- */
document.addEventListener('pointerdown',function(e){
  var h=e.target.closest&&e.target.closest('[data-handle]');
  if(!h||(e.pointerType==='mouse'&&e.button!==0)||!S.ui.arrange||!can('products'))return;
  var it=h.closest('[data-drag]');if(!it)return;
  var kind=it.getAttribute('data-drag-kind')||'product';
  var sp=it.parentNode.closest('.grid,.main,.chips,.groupbar');
  drag={el:it,id:it.getAttribute('data-drag'),kind:kind,cont:it.parentNode,sp:sp,x:e.clientX,y:e.clientY,cx:e.clientX,cy:e.clientY,s0:sp?sp.scrollTop:0,s0x:sp?sp.scrollLeft:0,on:false,tg:null,after:false,tm:0};
});
function dragUpdate(){
  var d=drag;if(!d||!d.on)return;
  var ds=d.sp?d.sp.scrollTop-d.s0:0,dxs=d.sp?d.sp.scrollLeft-d.s0x:0;
  d.el.style.transform='translate('+(d.cx-d.x+dxs)+'px,'+(d.cy-d.y+ds)+'px)';
  var t=document.elementFromPoint(d.cx,d.cy),tg=t&&t.closest?t.closest('[data-drag]'):null;
  if(tg===d.el)tg=null;
  if(d.kind==='category'){if(!tg||tg.getAttribute('data-drag-kind')!=='category'||tg.parentNode!==d.cont)tg=null;}
  else if(d.kind==='group'){if(!tg||tg.getAttribute('data-drag-kind')!=='group'||tg.parentNode!==d.cont)tg=null;}
  else if(tg&&tg.getAttribute('data-drag-kind')==='category'){} 
  else if(tg&&tg.parentNode!==d.cont)tg=null;
  Array.prototype.forEach.call(document.querySelectorAll('.drop-before,.drop-after'),function(n){n.classList.remove('drop-before','drop-after');});
  d.tg=tg;
  if(tg){var r=tg.getBoundingClientRect();d.after=(d.kind==='category'||d.kind==='group')?d.cx>r.left+r.width/2:(tg.getAttribute('data-drag-kind')==='category'?true:(d.cont.classList.contains('grid')?d.cx>r.left+r.width/2:d.cy>r.top+r.height/2));tg.classList.add(d.after?'drop-after':'drop-before');}
}
document.addEventListener('pointermove',function(e){
  var d=drag;if(!d)return;
  d.cx=e.clientX;d.cy=e.clientY;
  if(!d.on){if(Math.hypot(d.cx-d.x,d.cy-d.y)<8)return;d.on=true;d.el.classList.add('dragging');d.tm=setInterval(function(){if(d.sp){var r=d.sp.getBoundingClientRect();if(d.kind==='category'||d.kind==='group'){if(d.cx>r.right-56)d.sp.scrollLeft+=14;else if(d.cx<r.left+56)d.sp.scrollLeft-=14;}else{if(d.cy>r.bottom-70)d.sp.scrollTop+=14;else if(d.cy<r.top+70)d.sp.scrollTop-=14;}}dragUpdate();},30);}
  e.preventDefault();dragUpdate();
},{passive:false});
function dragEnd(ok){
  var d=drag;if(!d)return;drag=null;clearInterval(d.tm);
  if(d.on){
    suppressDragClick=true;setTimeout(function(){suppressDragClick=false;},0);
    d.el.classList.remove('dragging');d.el.style.transform='';
    if(ok&&d.tg){
      if(d.kind==='group'){var gs=catalogSettings(),go=groupOrder(),gids=go.filter(function(x){return x!==d.id;}),gix=gids.indexOf(d.tg.getAttribute('data-drag'));gids.splice(d.after?gix+1:gix,0,d.id);saveCatalogSettings({groupOrder:gids});}
      else if(d.kind==='category'){
        var cs=catalogSettings(),order=(cs.categoryOrder||[]).slice(),cats=orderedCategories(Array.from(new Set(S.products.map(function(p){return p.category||'Divers';}))));
        cats.forEach(function(c){if(order.indexOf(c)<0)order.push(c);});
        var shown=Array.prototype.map.call(d.cont.querySelectorAll('[data-drag-kind="category"]'),function(n){return n.getAttribute('data-drag');}),slots=[];
        shown.forEach(function(c,i){var pos=order.indexOf(c);if(pos<0){pos=order.length;order.push(c);}slots.push(pos);});
        var ids=shown.filter(function(x){return x!==d.id;});
        var ix=ids.indexOf(d.tg.getAttribute('data-drag'));ids.splice(d.after?ix+1:ix,0,d.id);
        slots.forEach(function(pos,i){order[pos]=ids[i];});
        saveCatalogSettings({categoryOrder:order,categoryColors:cs.categoryColors||{}});
      }else if(d.tg.getAttribute('data-drag-kind')==='category'){
        var pp=S.products.filter(function(x){return x.id===d.id;})[0],newCat=d.tg.getAttribute('data-drag');
        if(pp&&(pp.category||'Divers')!==newCat){wr(store.upd('products',d.id,{category:newCat,order:Date.now()}));toast('Produit déplacé vers '+newCat);}
      }else{
        var ids2=Array.prototype.map.call(d.cont.querySelectorAll('[data-drag-kind="product"]'),function(n){return n.getAttribute('data-drag');}).filter(function(x){return x!==d.id;});
        var ix2=ids2.indexOf(d.tg.getAttribute('data-drag'));ids2.splice(d.after?ix2+1:ix2,0,d.id);reorderProducts(ids2);
      }
    }
    Array.prototype.forEach.call(document.querySelectorAll('.drop-before,.drop-after'),function(n){n.classList.remove('drop-before','drop-after');});
    pend=false;schedule();
  }
}
document.addEventListener('pointerup',function(){dragEnd(true);});
document.addEventListener('pointercancel',function(){dragEnd(false);});
document.addEventListener('click',function(e){if(suppressDragClick){e.preventDefault();e.stopPropagation();suppressDragClick=false;}},{capture:true});
setInterval(function(){if(S.user&&Date.now()-lastAct>IDLE_MS)lock();},15000);

/* ---------- démarrage ---------- */
(async function boot(){
  render();
  try{
    if(window.claude&&window.claude.use){
      dbNS=await window.claude.use('db');
      dlNS=await window.claude.use('downloads');
    }
  }catch(e){dbNS=null;}
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
  S.backend=dbNS?'db':'local';
  startSync();
})();
})();
</script>
